<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventora - Test Frontend</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; padding: 20px 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[readonly] { background: #e9ecef; cursor: not-allowed; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .title { text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="title">Test Registration Details</h2>
        <form id="regForm">
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label>Auto-Calculated Age</label>
                <input type="number" id="age" readonly placeholder="Age will appear here...">
            </div>
            <p style="font-size: 12px; color: gray;">
                * This shows how the frontend automatically calculates age immediately when you select the date from the calendar.
            </p>
            <button type="button" onclick="alert('This is just a demo of the auto-calculate feature.')">Submit Details</button>
        </form>
    </div>

    <script>
        const dobInput = document.getElementById('dob');
        const ageInput = document.getElementById('age');

        dobInput.addEventListener('change', function() {
            const dobDate = new Date(this.value);
            if (!isNaN(dobDate)) {
                const today = new Date();
                let age = today.getFullYear() - dobDate.getFullYear();
                const m = today.getMonth() - dobDate.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < dobDate.getDate())) {
                    age--;
                }
                ageInput.value = age;
            } else {
                ageInput.value = '';
            }
        });
    </script>
</body>
</html>
